    <title>検査カレンダー同期</title>
    <style>
        body {
            font-family: sans-serif;

<body>
    <h1>検査カレンダー同期</h1>

    <h2>アプリについて</h2>
    <p>
        検査カレンダー同期は、建築物の検査予定を
        Googleカレンダーに自動登録・更新するためのツールです。
    </p>

    <h2>利用目的</h2>
    <p>
        検査予定の管理を効率化し、
        日時や現場情報の変更をGoogleカレンダーに反映します。
    </p>

    <h2>利用対象</h2>
    <p>
        本アプリは、開発者本人が業務上の予定を管理するために使用します。
        一般向けのサービスではありません。
    </p>

    <h2>Googleカレンダーとの連携</h2>
    <p>
        本アプリは、利用者の許可を得てGoogleカレンダーにアクセスし、
        検査予定の登録・更新を行います。
    </p>

    <h2>プライバシーポリシー</h2>
    <p>
        個人情報の取り扱いについては、
        <a href="privacy.html">プライバシーポリシー</a>
        をご確認ください。
    </p>
</body>
</html>
